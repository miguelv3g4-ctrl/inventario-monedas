const URL_DATOS='datos.json';
// Botones del menú de la app (mismo orden y nombre que en el inventario)
const SECCIONES=[
 {id:'conmemorativas',nombre:'Monedas conmemorativas nuevo cono monetario'},
 {id:'billetes',nombre:'Billetes Costa Rica'},
 {id:'antano',nombre:'Colecciones de antaño'},
 {id:'cono-1995-2021',nombre:'Cono monetario 1995 a 2021'},
 {id:'plata',nombre:'Monedas conmemorativas plata'},
 {id:'replicas',nombre:'Conmemorativas réplicas'},
 {id:'coleccionadores-acrilicos',nombre:'Coleccionadores acrílicos'},
 {id:'museo-bccr',nombre:'Coleccionadores Museo Banco Central'},
 {id:'ms-sueltas',nombre:'Monedas MS sueltas'}
];
const CAMPOS=[
 {k:'costo',t:'Costo (₡)',tipo:'number',ph:'0'},
 {k:'fechaCompra',t:'Fecha compra',tipo:'date'},
 {k:'origen',t:'Origen / dónde',tipo:'text',ph:'banco, museo, tienda…',lista:true},
 {k:'valor',t:'Valor actual (₡)',tipo:'number',ph:'0'},
 {k:'cantidad',t:'Cantidad',tipo:'number',ph:'1'}
];
const LS='faltantes_inventario';
let ver={costo:1,fechaCompra:0,origen:0,valor:1,cantidad:0}; // por ahora fecha y origen no cuentan como faltantes (se pueden activar arriba)
let cambios={};try{cambios=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
let PIEZAS=[],BASE='',origenes=[];
const $=id=>document.getElementById(id);
const vacio=v=>v===undefined||v===null||v===''||(typeof v==='number'&&isNaN(v));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function guardar(){try{localStorage.setItem(LS,JSON.stringify(cambios))}catch(e){}}

// Arma la lista de piezas que tengo, cada una con el botón (sección) de la app donde está
function armar(d){
 const hojaPor={};DATOS.hoja.forEach(h=>hojaPor[h.id]=h);
 const otraPor={};(d.otras||[]).forEach(o=>otraPor[o.id]=o);
 const out=[];
 for(const [id,x] of Object.entries(d.piezas)){
  if(!x.tengo||x.textoPrecio||x.enColeccion)continue; // sin valor propio: invaluable o 'ver valor en colección completa'
  const h=hojaPor[id],o=otraPor[id];
  let sec,sub,nombre;
  if(h){sec='conmemorativas';sub=h.coleccion;nombre=h.moneda+' · '+h.tipo+(h.anio?' '+h.anio:'')}
  else if(o){sec=o.seccion||'conmemorativas';sub=o.categoria||'Sin categoría';nombre=o.nombre||x.producto||'(sin nombre)'}
  else{sec='?';sub='';nombre=x.producto||id}
  out.push({id,sec,sub,nombre,costo:x.costo,fechaCompra:x.fechaCompra,origen:x.origen,valor:x.valor,cantidad:x.cantidad});
 }
 PIEZAS=out;
 origenes=[...new Set(out.map(p=>p.origen).filter(Boolean))];
 // si lo que escribí ya está lleno en el inventario, se descarta el borrador
 for(const id of Object.keys(cambios)){
  const p=out.find(q=>q.id===id);
  if(!p){delete cambios[id];continue}
  for(const k of Object.keys(cambios[id]))if(!vacio(p[k]))delete cambios[id][k];
  if(!Object.keys(cambios[id]).length)delete cambios[id];
 }
 guardar();
}
function pideFalta(p,cols){return cols.some(c=>vacio(p[c.k]))}
function esFalta(p,c){return vacio(p[c.k])&&vacio((cambios[p.id]||{})[c.k])}
function pintar(){
 const cols=CAMPOS.filter(c=>ver[c.k]);
 const orden=SECCIONES.concat([{id:'?',nombre:'Sin identificar (revisar)'}]);
 let html='';
 orden.forEach(sc=>{
  const filas=PIEZAS.filter(p=>p.sec===sc.id&&pideFalta(p,cols));
  if(!filas.length)return;
  const falt=filas.reduce((s,p)=>s+cols.filter(c=>esFalta(p,c)).length,0);
  filas.sort((a,b)=>a.sub.localeCompare(b.sub,'es',{numeric:true})||a.nombre.localeCompare(b.nombre,'es',{numeric:true}));
  html+=`<details open><summary>${esc(sc.nombre)}<small>botón del menú</small><span class="n">${filas.length} piezas · faltan ${falt}</span></summary><div class="wrap"><table><thead><tr><th>Pieza</th>${cols.map(c=>`<th>${c.t}</th>`).join('')}</tr></thead><tbody>`;
  let ult=null;
  filas.forEach(p=>{
   if(p.sub!==ult){ult=p.sub;if(ult)html+=`<tr class="sub"><td colspan="${cols.length+1}">${esc(ult)}</td></tr>`}
   html+=`<tr><td class="nom">${esc(p.nombre)}<small>${esc(p.id)}</small></td>`;
   cols.forEach(c=>{
    const ya=!vacio(p[c.k]),nv=(cambios[p.id]||{})[c.k];
    const val=ya?p[c.k]:(!vacio(nv)?nv:'');
    const cls=ya?'ya':(!vacio(nv)?'nuevo':'falta');
    html+=`<td><input class="f ${cls}" ${ya?'readonly tabindex="-1"':''} type="${c.tipo}" ${c.lista?'list="dlOr"':''} placeholder="${c.ph||''}" data-id="${esc(p.id)}" data-k="${c.k}" value="${esc(val)}"></td>`;
   });
   html+='</tr>';
  });
  html+='</tbody></table></div></details>';
 });
 $('main').innerHTML=html||'<div class="fin">🎉 No falta nada en las columnas activas.</div>';
 $('dlOr').innerHTML=origenes.map(o=>`<option value="${esc(o)}">`).join('');
 resumen();
}
function resumen(){
 const cols=CAMPOS.filter(c=>ver[c.k]);let falta=0,tot=0;
 PIEZAS.forEach(p=>cols.forEach(c=>{tot++;if(esFalta(p,c))falta++}));
 let nc=0;Object.values(cambios).forEach(o=>nc+=Object.keys(o).length);
 $('nCamb').textContent=nc;$('nPz').textContent=Object.keys(cambios).length;$('nFalta').textContent=falta;
 $('barra').style.width=(tot?100*(tot-falta)/tot:0)+'%';
}
$('main').addEventListener('change',e=>{
 const i=e.target;if(!i.dataset.id)return;
 const id=i.dataset.id,k=i.dataset.k,c=CAMPOS.find(x=>x.k===k);
 let v=i.value.trim();if(c.tipo==='number'&&v!=='')v=Number(v);
 cambios[id]=cambios[id]||{};
 if(v===''){delete cambios[id][k];if(!Object.keys(cambios[id]).length)delete cambios[id]}else cambios[id][k]=v;
 i.className='f '+(v===''?'falta':'nuevo');guardar();resumen();
});
$('cols').innerHTML=CAMPOS.map(c=>`<label class="chk"><input type="checkbox" data-c="${c.k}" ${ver[c.k]?'checked':''}> ${c.t.split(' (')[0]}</label>`).join('');
$('cols').onchange=e=>{ver[e.target.dataset.c]=e.target.checked?1:0;pintar()};
$('bBorrar').onclick=()=>{if(confirm('¿Borrar todo lo que escribiste en esta página?')){cambios={};guardar();pintar()}};
$('bRep').onclick=()=>{
 const por={};PIEZAS.forEach(p=>{const c=cambios[p.id];if(c){const sc=SECCIONES.find(s=>s.id===p.sec);por[p.id]={nombre:p.nombre,boton:sc?sc.nombre:p.sec,categoria:p.sub,...c}}});
 if(!Object.keys(por).length){alert('Aún no has llenado nada.');return}
 const rep={tipo:'reporte-llenado',base:BASE,creado:new Date().toISOString(),piezas:por};
 const txt=JSON.stringify(rep,null,1);
 let m=$('modal');if(m)m.remove();
 m=document.createElement('div');m.id='modal';
 m.style.cssText='position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px';
 m.innerHTML='<div style="background:#1f1a10;border:1px solid #3a3220;border-radius:10px;padding:14px;width:min(720px,100%);display:flex;flex-direction:column;gap:10px"><b style="color:#ffd966">Reporte: '+Object.keys(por).length+' piezas</b><span style="color:#a89c7c">Copia todo este texto y pégalo en el chat (o guárdalo en un archivo .json).</span><textarea id="repTxt" readonly style="height:50vh;background:#0d0b06;color:#f1e9d2;border:1px solid #3a3220;border-radius:6px;padding:8px;font:12px monospace"></textarea><div style="display:flex;gap:8px;justify-content:flex-end"><button id="repCop">Copiar todo</button><button class="sec" id="repCer">Cerrar</button></div></div>';
 document.body.appendChild(m);
 const ta=$('repTxt');ta.value=txt;ta.focus();ta.select();
 $('repCop').onclick=()=>{ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});$('repCop').textContent='¡Copiado!'};
 $('repCer').onclick=()=>m.remove();
};
async function cargar(){
 const f=$('fuente');f.className='';f.textContent='Buscando datos al día en GitHub…';
 try{
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
  const r=await fetch(URL_DATOS+'?t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(t);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();if(!d.piezas)throw new Error('formato');
  BASE='en vivo '+new Date().toLocaleString('es-CR');armar(d);
  f.className='ok';f.textContent='✔ Datos al día leídos de tu inventario en GitHub ('+BASE+'). Solo aparece lo que aún falta.';
 }catch(e){
  BASE='copia '+DATOS.generado;armar(DATOS.snap);
  f.className='aviso';f.textContent='⚠ No se pudo leer GitHub ('+e.message+'). Usando la copia del '+DATOS.generado+': puede mostrar piezas que ya llenaste. Pulsa "Actualizar datos" para reintentar.';
 }
 pintar();
}
$('bRecargar').onclick=cargar;
// revisa solo al volver a la pestaña y cada 3 minutos (sin tocar lo que estás escribiendo)
const escribiendo=()=>{const a=document.activeElement;return a&&a.dataset&&a.dataset.id};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!escribiendo())cargar()});
window.addEventListener('focus',()=>{if(!escribiendo())cargar()});
setInterval(()=>{if(!document.hidden&&!escribiendo())cargar()},180000);
const dl=document.createElement('datalist');dl.id='dlOr';document.body.appendChild(dl);
cargar();
</script></body></html>
